components:
  schemas:
    GenericResponse:
      properties:
        data:
          type: object
          nullable: true
          example: Estructura generica.
        errorCode:
          type: integer
          example: 0
        message:
          type: string
          example: Mensaje generico.
        internalTransactionId:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        externalTransactionId:
          type: string
          example: fcea920f7412b5da7be0cf42b8c93759
      example:
        errorCode: 0
        internalTransactionId: d290f1ee-6c54-4b01-90e6-d701748f0851
        externalTransactionId: fcea920f7412b5da7be0cf42b8c93759
        message: Mensaje generico.
        data: {}
    ResponseError:
      type: object
      properties:
        errorCode:
          type: integer
        internalTransactionId:
          type: string
        externalTransactionId:
          type: string
        message:
          type: string
    RequestGeneric:
      properties:
        channel:
          type: string
          example: ZENTINEL
        externalTransactionId:
          type: string
          example: fcea920f7412b5da7be0cf42b8c9375
    RequestDispatch:
      properties:
        dispatch_data:
          $ref: "#/components/schemas/RequestDispatch_dispatch_data"
        channel:
          type: string
          example: ZENTINEL
        externalTransactionId:
          type: string
          example: fcea920f7412b5da7be0cf42b8c93759
    RequestDispatch_dispatch_data_products_sku:
      type: object
      properties:
        id_product:
          type: integer
          example: 1
        quantity:
          type: number
          example: 10
    RequestSkuData:
      type: object
      properties:
        type_sku:
          type: string
          example: "Multiple"
        products:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RequestDispatch_dispatch_data_products_sku"
    MaterialAccessData:
      type: object
      properties:
        id_material:
          type: integer
          example: 1
        quantity:
          type: number
          example: 10
    RequestDispatch_dispatch_data:
      type: object
      properties:
        weight:
          type: number
          format: double
          example: 2000000.75
          nullable: true
        vehicle_type:
          nullable: true
          type: integer
          example: 1
        destiny:
          nullable: true
          type: integer
          example: 1
        status_id:
          type: integer
          nullable: true
          example: 1
        order_number:
          nullable: true
          type: string
          example: 123456
        truck_license:
          nullable: true
          type: string
          example: GME-511
        user:
          nullable: true
          type: string
          example: dmales
        driver:
          nullable: true
          type: string
          example: Daniel
        images:
          nullable: true
          maxItems: 10
          type: array
          items:
            type: string
            format: binary
        sku:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RequestSkuData"
        observations:
          type: string
